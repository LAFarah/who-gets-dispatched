[project]
name = "ukpn-flex"
version = "0.1.0"
description = "Analysis of UK Power Networks flexibility dispatch data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "duckdb>=1.1", "jupyter>=1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
