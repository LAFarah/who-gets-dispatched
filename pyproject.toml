[project]
name = "ukpn-flex"
version = "0.1.0"
description = "Is distributed flexibility winning share in UKPN dispatches, and what is it paid relative to grid-scale?"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
